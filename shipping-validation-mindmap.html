<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운송 밸리데이션 대응자료</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --mm-accent:#E60044;
  --mm-bg:#FFFFFF;
  --mm-panel:#FFFFFF;
  --mm-text:#1A1A1A;
  --mm-muted:#727171;
  --mm-line:#E4E4E7;
  --mm-node-bg:#FFFFFF;
  --mm-hover:#F7F7F8;
}
.theme-dark{
  --mm-bg:#12141A; --mm-panel:#1B1E26; --mm-text:#F5F5F5;
  --mm-muted:#9AA0AC; --mm-line:#2C313C; --mm-node-bg:#1B1E26; --mm-hover:#232833;
}
.theme-neutral{ --mm-accent:#3F3F46; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;width:100%}
body{
  font-family:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--mm-bg); color:var(--mm-text); overflow:hidden;
}
body.transparent{background:transparent}
#app{display:flex;flex-direction:column;height:100%;width:100%}

header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 18px;border-bottom:1px solid var(--mm-line);
  background:var(--mm-bg);z-index:5;flex:0 0 auto;
}
body.transparent header{background:transparent}
.hd-title{font-size:16px;font-weight:700;letter-spacing:-.2px}
.hd-sub{font-size:12px;color:var(--mm-muted);margin-top:2px}
.hd-left{display:flex;flex-direction:column;min-width:0}
.spacer{flex:1 1 auto}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
button.tool{
  font:inherit;font-size:12px;padding:6px 11px;border-radius:7px;
  border:1px solid var(--mm-line);background:var(--mm-node-bg);color:var(--mm-text);
  cursor:pointer;transition:background .12s,border-color .12s;
}
button.tool:hover{background:var(--mm-hover);border-color:var(--mm-muted)}
button.tool:focus-visible{outline:2px solid var(--mm-accent);outline-offset:1px}
#search{
  font:inherit;font-size:12px;padding:6px 10px;border-radius:7px;width:150px;
  border:1px solid var(--mm-line);background:var(--mm-node-bg);color:var(--mm-text);
}
#search:focus{outline:2px solid var(--mm-accent);outline-offset:0;border-color:transparent}
#hitcount{font-size:11px;color:var(--mm-muted);min-width:38px}

#stage{position:relative;flex:1 1 auto;min-height:0}
svg#canvas{display:block;width:100%;height:100%;cursor:grab}
svg#canvas.grabbing{cursor:grabbing}
.node-g{cursor:pointer}
.node-g:focus{outline:none}
.node-g.dim{opacity:.18}
.node-g.hit .node-box{stroke-width:2}

#panel{
  position:absolute;top:12px;right:12px;width:300px;max-height:calc(100% - 24px);
  background:var(--mm-panel);border:1px solid var(--mm-line);border-radius:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.10);padding:16px 16px 18px;
  overflow-y:auto;display:none;z-index:4;
}
#panel.open{display:block}
#panel .p-close{
  position:absolute;top:10px;right:10px;border:none;background:transparent;
  color:var(--mm-muted);font-size:18px;line-height:1;cursor:pointer;padding:4px;
}
#panel .p-path{font-size:11px;color:var(--mm-muted);margin-bottom:6px;padding-right:22px;word-break:keep-all}
#panel .p-name{font-size:15px;font-weight:700;margin-bottom:8px;padding-right:22px;word-break:keep-all}
#panel .p-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
#panel .p-tag{font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--mm-line);color:var(--mm-muted)}
#panel .p-note{font-size:13px;line-height:1.65;color:var(--mm-text);white-space:pre-wrap;word-break:keep-all}
#panel .p-empty{font-size:12.5px;color:var(--mm-muted);font-style:italic}
#panel .p-link{display:inline-block;margin-top:12px;font-size:12px;color:var(--mm-accent);text-decoration:none;font-weight:600}
#panel .p-link:hover{text-decoration:underline}
#panel .p-meta{margin-top:14px;padding-top:10px;border-top:1px solid var(--mm-line);font-size:11px;color:var(--mm-muted)}

#hint{
  position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--mm-muted);
  background:var(--mm-panel);border:1px solid var(--mm-line);border-radius:7px;
  padding:5px 9px;opacity:.85;pointer-events:none;
}
body.transparent #hint{background:transparent;border-color:transparent}
@media (max-width:640px){
  #panel{width:auto;left:12px;right:12px;top:auto;bottom:12px;max-height:52%}
  #search{width:110px}
  #hint{display:none}
}

#cl-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  display:none;align-items:center;justify-content:center;z-index:20;padding:24px;
}
#cl-overlay.open{display:flex}
#cl-modal{
  background:var(--mm-panel);border:1px solid var(--mm-line);border-radius:14px;
  width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative;
}
#cl-modal .p-close{position:absolute;top:10px;right:10px}
#cl-head{padding:20px 22px 14px;border-bottom:1px solid var(--mm-line)}
#cl-title{font-size:16px;font-weight:700;margin-bottom:10px;padding-right:22px}
#cl-progress-row{display:flex;align-items:center;gap:10px}
#cl-progress-text{font-size:12px;color:var(--mm-muted);white-space:nowrap;min-width:78px}
#cl-progress-bar{flex:1 1 auto;height:6px;border-radius:99px;background:var(--mm-line);overflow:hidden}
#cl-progress-fill{height:100%;background:var(--mm-accent);width:0%;transition:width .2s}
#cl-body{padding:14px 22px;overflow-y:auto;flex:1 1 auto}
.cl-section{margin-bottom:16px}
.cl-section:last-child{margin-bottom:0}
.cl-section-head{
  font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--cl-accent, var(--mm-text));
  margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--mm-line);
}
.cl-section .cl-section{margin-left:14px;margin-top:8px}
.cl-row{
  display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:13px;
  color:var(--mm-text);cursor:pointer;border-radius:6px;
}
.cl-row:hover{background:var(--mm-hover)}
.cl-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--mm-accent);cursor:pointer;flex:0 0 auto}
.cl-row-name{flex:1 1 auto;word-break:keep-all}
.cl-row.checked .cl-row-name{color:var(--mm-muted);text-decoration:line-through}
.cl-row-tags{font-size:10px;color:var(--mm-muted);white-space:nowrap}
#cl-foot{
  padding:12px 22px;border-top:1px solid var(--mm-line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
#cl-hint2{font-size:10.5px;color:var(--mm-muted)}
@media (max-width:640px){
  #cl-modal{max-height:82vh}
  #cl-foot{flex-direction:column;align-items:flex-start;gap:8px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hd-left">
      <div class="hd-title" id="hd-title">운송 밸리데이션 대응자료</div>
      <div class="hd-sub" id="hd-sub"></div>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <input id="search" type="search" placeholder="노드 검색" aria-label="노드 검색">
      <span id="hitcount"></span>
      <button class="tool" id="btn-expand-one" title="현재 보이는 가장 깊은 레벨에서 한 단계 더 펼침">+한 단계</button>
      <button class="tool" id="btn-collapse-one" title="가장 바깥 레벨을 한 단계 접음">−한 단계</button>
      <button class="tool" id="btn-expand">전체 펼치기</button>
      <button class="tool" id="btn-collapse">접기</button>
      <button class="tool" id="btn-fit">화면 맞춤</button>
      <button class="tool" id="btn-layout">방사형</button>
      <button class="tool" id="btn-checklist">체크리스트</button>
      <button class="tool" id="btn-svg">SVG</button>
      <button class="tool" id="btn-png">PNG</button>
    </div>
  </header>
  <div id="stage">
    <svg id="canvas" role="img" aria-label="마인드맵"></svg>
    <aside id="panel" aria-live="polite">
      <button class="p-close" id="p-close" aria-label="닫기">&times;</button>
      <div class="p-path" id="p-path"></div>
      <div class="p-name" id="p-name"></div>
      <div class="p-tags" id="p-tags"></div>
      <div id="p-body"></div>
      <div class="p-meta" id="p-meta"></div>
    </aside>
    <div id="hint">드래그=이동 · 휠=줌 · 클릭=상세 · 노드 우측 원=접기(분기)/확보체크(말단) · +/−한 단계=레벨별 펼침</div>
  </div>
</div>

<div id="cl-overlay">
  <div id="cl-modal" role="dialog" aria-modal="true" aria-label="확보 자료 체크리스트">
    <button class="p-close" id="cl-close" aria-label="닫기">&times;</button>
    <div id="cl-head">
      <div id="cl-title">확보 자료 체크리스트</div>
      <div id="cl-progress-row">
        <div id="cl-progress-text">0 / 0 확보</div>
        <div id="cl-progress-bar"><div id="cl-progress-fill"></div></div>
      </div>
    </div>
    <div id="cl-body"></div>
    <div id="cl-foot">
      <button class="tool" id="cl-reset">전체 초기화</button>
      <span id="cl-hint2">체크 상태는 이 브라우저에만 저장됩니다</span>
    </div>
  </div>
</div>

<script>
const RAW_DATA = {"root": {"name": "운송 밸리데이션 대응자료", "note": "ASTM D4169 Distribution Cycle 13(DC-13) 기반 · 당사 P-LA3-103-00 Shipping Validation Protocol / R-LA3-103-00 Shipping Report 근거 · 포장 규정(PPWR) 대응자료의 1차/2차/3차 포장 구분과 직접 연결됨 — 포장 최소화·재질 변경 시 이 마인드맵의 재검토 항목도 함께 확인.", "children": [
  {"name": "제품·포장 구조 정의", "note": "Protocol §1.3-1.6 근거", "children": [
    {"name": "제품 사양서", "note": "테스트기 제품 사양(모델·구성품·전원 등). Shipping Validation Protocol §1.3-1.4 근거."},
    {"name": "포장 구성 정의서(1차/2차/3차)", "note": "1차(Outer box: 디바이스+IFU+지지대, 예 200x63x45mm)·2차(Carton box: 1차포장 다수 EA)·3차(Pallet: 2차포장 다수 EA, 최종 운송단위) 구조·치수·중량 정의. 포장 규정(PPWR) 대응자료의 1차(제품접촉)/2차(외포장)/3차(운송포장) 구분과 1:1 대응."},
    {"name": "포장재 사양 및 공급업체 정보", "note": "포장 재질(코팅지, EVA 폼 등) 및 공급업체별 사양·중량 허용오차."},
    {"name": "제조·포장 기록 연계 문서", "note": "Manufacturing Flow Chart(SOP-PR-125)·제조기록(MR)·포장기록(PR) — 밸리데이션 시료가 실제 절차대로 제조·포장됐다는 근거."}
  ]},
  {"name": "밸리데이션 계획(Protocol)", "note": "Shipping Validation Protocol §2 근거", "children": [
    {"name": "적용표준 확인서", "note": "ASTM D4169 Distribution Cycle 13(DC-13) 적용 — ISTA 3A 아님(과거 ISTA 3A 기준으로 개발했다가 사내 실제 표준이 DC-13임을 확인하고 전면 개편한 사례 있음, 표준 재확인 필수)."},
    {"name": "유통 사이클 정의서", "note": "핸들링(충격,1h)→지상운송 포장도로진동(4h)→항공/해상운송 비포장도로진동(5h)→지상운송 포장도로진동(4h)→핸들링(충격,1h), 총 15h. 이동속도 최대 80km/h(평균 60km/h), 포장도로 약 240km/비포장도로 약 300km."},
    {"name": "환경조건(온습도) 정의서", "note": "3계절(겨울 -15±3℃/봄가을 20-25℃/여름 40±3℃) × 유통사이클 후 72시간 챔버보관 5조건(무보관/-15·90%RH/65·90%RH/-15·10%RH/65·10%RH, SU-R-T-171 챔버 설정 기준) = 총 15개 세부조건. 72시간은 ASTM D4169 권장 보관기간."},
    {"name": "샘플링 계획서", "note": "ISO 2859-1 기준. 1 lot = 단일포장단위(파렛트 1개). Inspection Level S-2 / AQL 2.5 → 시험당 샘플 5개."}
  ]},
  {"name": "밸리데이션 시험·판정", "note": "Protocol §3 / Report §5 근거", "children": [
    {"name": "포장 무결성 검사 기록", "note": "유통사이클 시뮬레이션 전후 포장 손상 여부 확인(파렛트·카톤박스·아웃박스 전 단계). 손상 발생 시 불합격 — 예외 없음."},
    {"name": "제품 성능시험 기록", "note": "외관·디바이스 상태표시·부속품 삽입·무선통신·라벨·정량분석(색상강도) 등 항목별 시험. Final Product QC SOP 기준 판정."},
    {"name": "전기적합성 시험 제외 근거서", "note": "전기부품 변경이 없는 경우 접지저항·누설전류·내전압 시험은 제외 가능 — 제외할 경우 그 근거를 문서로 남겨야 함."},
    {"name": "밸리데이션 리포트(Shipping Report)", "note": "R-LA3-103-00. Protocol 대비 실제 수행결과·판정·이탈사항·최종 결론(Conclusion)을 정리한 최종 보고서."}
  ]},
  {"name": "일정·책임·모니터링", "note": "Protocol §4-6 근거", "children": [
    {"name": "밸리데이션 일정·장소 기록", "note": "계획-수행-보고 일정 및 시험장소(자체 실험실 등) 기록."},
    {"name": "역할·책임 지정서", "note": "Study Coordinator/Reviewer/Researcher/Overall Supervisor 지정 — 프로토콜 작성·검토·시험수행·최종승인 역할을 분리해서 명시."},
    {"name": "시판 후 포장 피드백 모니터링 기록", "note": "출하 후 포장·성능 이상 여부를 자재 및 제품관리(SU-QP-704)·모니터링 및 측정관리(SU-QP-812) 절차 기준으로 모니터링, 필요시 개선활동 입력자료로 활용."}
  ]},
  {"name": "포장 변경 시 재검토", "note": "재밸리데이션 트리거 관리", "children": [
    {"name": "포장/제품 변경영향평가서", "note": "포장 형태나 제품 모델의 구조·크기·무게·재질·용도가 유의하게 달라지거나 운송 중 성능저하 우려가 커지는 경우, 추가 밸리데이션 필요 여부를 판단한 기록."},
    {"name": "PPWR 연계 재검토 체크리스트", "note": "포장 규정(PPWR) 대응으로 포장 최소화(빈공간비율 50% 이하)·재질 변경(재활용원료 함량 준수)이 반영되면 운송 밸리데이션 재수행 필요 여부를 확인 — 포장 규정(PPWR) 대응자료와 상호 참조."}
  ]}
]}, "title": "운송 밸리데이션 대응자료", "layout": "horizontal", "theme": "sugentech", "transparent": true};

/* ---------- config ---------- */
const PALETTES = {
  sugentech: ["#E60044","#C4003A","#8A4B5E","#727171","#4A5568","#2D3748"],
  neutral:   ["#3F3F46","#52525B","#71717A","#8A8A93","#A1A1AA","#5B5B63"],
  dark:      ["#FF4D77","#FF8A5B","#FFD166","#5BC8AF","#5B9BD5","#B08BE8"]
};
const FONT = "'Pretendard','Noto Sans KR',sans-serif";
const NODE_H = 30, ROOT_H = 38, PAD_X = 12, GAP_X = 46, ROW_H = 34, MAX_W = 300;

const theme  = RAW_DATA.theme || "sugentech";
const colors = PALETTES[theme] || PALETTES.sugentech;
let layout   = RAW_DATA.layout === "radial" ? "radial" : "horizontal";

if (theme === "dark") document.body.classList.add("theme-dark");
if (theme === "neutral") document.body.classList.add("theme-neutral");
if (RAW_DATA.transparent) document.body.classList.add("transparent");

const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { text:cssv("--mm-text"), muted:cssv("--mm-muted"), line:cssv("--mm-line"),
            nodeBg:cssv("--mm-node-bg"), accent:cssv("--mm-accent") };

document.getElementById("hd-title").textContent = RAW_DATA.title || RAW_DATA.root.name || "마인드맵";
document.title = RAW_DATA.title || RAW_DATA.root.name || "마인드맵";
if (RAW_DATA.subtitle) document.getElementById("hd-sub").textContent = RAW_DATA.subtitle;

/* ---------- text measurement ---------- */
const mctx = document.createElement("canvas").getContext("2d");
function measure(text, size, weight){
  mctx.font = `${weight} ${size}px ${FONT}`;
  return mctx.measureText(text || "").width;
}
function truncate(text, size, weight, max){
  if (measure(text, size, weight) <= max) return text;
  let s = text;
  while (s.length > 1 && measure(s + "…", size, weight) > max) s = s.slice(0, -1);
  return s + "…";
}

/* ---------- hierarchy ---------- */
const root = d3.hierarchy(RAW_DATA.root, d => d.children);
let uid = 0;
root.each(d => {
  d.id = ++uid;
  d.h = d.depth === 0 ? ROOT_H : NODE_H;
  d.kidCount = (d.children || []).length;
  d.pathKey = d.ancestors().reverse().map(a => a.data.name).join(" > ");
  // branch color inherited from the depth-1 ancestor
  if (d.depth === 0) d.color = C.accent;
  else {
    const a1 = d.ancestors().find(n => n.depth === 1);
    const idx = a1 ? (a1.parent.children.indexOf(a1) % colors.length) : 0;
    d.color = (a1 && a1.data.color) || colors[idx];
  }
});

// 폰트가 늦게 로드되면 폭이 틀어지므로 측정은 별도 함수로 두고 재호출한다
function remeasure(){
  root.each(d => {
    const fs = d.depth === 0 ? 15 : 13.5;
    const fw = d.depth === 0 ? 700 : (d.depth === 1 ? 600 : 500);
    d.fs = fs; d.fw = fw;
    d.label = truncate(d.data.name || "", fs, fw, MAX_W - 2 * PAD_X - 26);
    d.tagW = (d.data.tags || []).reduce((a, t) => a + measure(t, 10, 500) + 16 + 4, 0);
    d.w = Math.max(64,
          PAD_X * 2 + measure(d.label, fs, fw) + d.tagW + 20);
  });
}
remeasure();

// initial collapse
const collapseDepth = (RAW_DATA.collapseDepth === undefined ? null : RAW_DATA.collapseDepth);
function collapse(d){ if (d.children){ d._children = d.children; d._children.forEach(collapse); d.children = null; } }
root.each(d => {
  if (d.data.collapsed === true) collapse(d);
  else if (collapseDepth !== null && d.depth >= collapseDepth && d.children) collapse(d);
});

/* ---------- checklist (확보 자료) ---------- */
const CHECK_KEY = "bcm_checklist_" + (RAW_DATA.title || RAW_DATA.root.name || "default");
function loadChecks(){
  try { return JSON.parse(localStorage.getItem(CHECK_KEY) || "{}"); }
  catch(e){ return {}; }
}
function saveChecks(){
  try { localStorage.setItem(CHECK_KEY, JSON.stringify(checks)); } catch(e){}
}
let checks = loadChecks();
function setChecked(d, val){
  if (val) checks[d.pathKey] = true; else delete checks[d.pathKey];
  saveChecks();
}
function toggleCheckNode(d){ setChecked(d, !checks[d.pathKey]); }

function collectLeafKeys(node, path, acc){
  const here = path.concat([node.name]);
  if (!node.children || !node.children.length) acc.push(here.join(" > "));
  else node.children.forEach(c => collectLeafKeys(c, here, acc));
  return acc;
}
const ALL_LEAF_KEYS = collectLeafKeys(RAW_DATA.root, [], []);
function updateProgress(){
  const total = ALL_LEAF_KEYS.length;
  const done = ALL_LEAF_KEYS.filter(k => checks[k]).length;
  document.getElementById("cl-progress-text").textContent = `${done} / ${total} 확보`;
  document.getElementById("cl-progress-fill").style.width = (total ? (done / total * 100) : 0) + "%";
}

function renderChecklistNode(node, path, container, depth){
  const here = path.concat([node.name]);
  const key = here.join(" > ");
  if (!node.children || !node.children.length){
    const row = document.createElement("label");
    row.className = "cl-row" + (checks[key] ? " checked" : "");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!checks[key];
    cb.addEventListener("change", () => {
      if (cb.checked) checks[key] = true; else delete checks[key];
      saveChecks();
      row.classList.toggle("checked", cb.checked);
      updateProgress();
      render();
    });
    const name = document.createElement("span");
    name.className = "cl-row-name";
    name.textContent = node.name;
    row.appendChild(cb);
    row.appendChild(name);
    if (node.tags && node.tags.length){
      const tags = document.createElement("span");
      tags.className = "cl-row-tags";
      tags.textContent = node.tags.join(" · ");
      row.appendChild(tags);
    }
    if (node.note) row.title = node.note;
    container.appendChild(row);
  } else {
    const section = document.createElement("div");
    section.className = "cl-section";
    const head = document.createElement("div");
    head.className = "cl-section-head";
    head.textContent = node.name;
    if (node.color) head.style.setProperty("--cl-accent", node.color);
    section.appendChild(head);
    const body = document.createElement("div");
    body.className = "cl-section-body";
    node.children.forEach(c => renderChecklistNode(c, here, body, depth + 1));
    section.appendChild(body);
    container.appendChild(section);
  }
}
function buildChecklist(){
  const container = document.getElementById("cl-body");
  container.innerHTML = "";
  const rootPath = [RAW_DATA.root.name];
  RAW_DATA.root.children.forEach(c => renderChecklistNode(c, rootPath, container, 0));
  updateProgress();
}

const clOverlay = document.getElementById("cl-overlay");
document.getElementById("btn-checklist").onclick = () => { buildChecklist(); clOverlay.classList.add("open"); };
document.getElementById("cl-close").onclick = () => clOverlay.classList.remove("open");
clOverlay.addEventListener("click", e => { if (e.target === clOverlay) clOverlay.classList.remove("open"); });
document.getElementById("cl-reset").onclick = () => {
  if (confirm("체크리스트를 모두 초기화할까요?")){
    checks = {}; saveChecks(); buildChecklist(); render();
  }
};

/* ---------- svg scaffold ---------- */
const svg = d3.select("#canvas");
const gRoot = svg.append("g");
const gLink = gRoot.append("g").attr("fill","none");
const gNode = gRoot.append("g");

const zoom = d3.zoom().scaleExtent([0.15, 3]).on("zoom", ev => gRoot.attr("transform", ev.transform));
svg.call(zoom)
   .on("mousedown.cur", () => svg.classed("grabbing", true))
   .on("mouseup.cur mouseleave.cur", () => svg.classed("grabbing", false))
   .on("dblclick.zoom", null);

/* ---------- layout ---------- */
function computeHorizontal(){
  d3.tree().nodeSize([ROW_H, 1]).separation((a,b) => a.parent === b.parent ? 1 : 1.35)(root);
  // per-depth column offsets based on the widest node at each depth
  const widest = {};
  root.each(d => { widest[d.depth] = Math.max(widest[d.depth] || 0, d.w); });
  const offset = {0: 0};
  const maxD = Math.max(...Object.keys(widest).map(Number));
  for (let i = 1; i <= maxD; i++) offset[i] = offset[i-1] + widest[i-1] + GAP_X;
  root.each(d => { d.px = offset[d.depth]; d.py = d.x; });
}
function computeRadial(){
  const nodes = root.descendants().length;
  const radius = Math.max(230, Math.min(620, 42 * Math.sqrt(nodes) + 130));
  d3.tree().size([2*Math.PI, radius])
    .separation((a,b) => (a.parent === b.parent ? 1 : 2) / Math.max(a.depth,1))(root);
  root.each(d => {
    d.angle = d.x - Math.PI/2;
    d.px = Math.cos(d.angle) * d.y;
    d.py = Math.sin(d.angle) * d.y;
  });
}

function linkPath(l){
  const p = l.source, d = l.target;
  if (layout === "radial"){
    const mx = (p.px + d.px) / 2, my = (p.py + d.py) / 2;
    return `M${p.px},${p.py}Q${mx},${my} ${d.px},${d.py}`;
  }
  const x0 = p.px + p.w, x1 = d.px, mid = (x0 + x1) / 2;
  return `M${x0},${p.py}C${mid},${p.py} ${mid},${d.py} ${x1},${d.py}`;
}

/* ---------- render ---------- */
let selected = null;
function render(){
  layout === "radial" ? computeRadial() : computeHorizontal();
  const nodes = root.descendants();
  const links = root.links();

  const link = gLink.selectAll("path").data(links, d => d.target.id);
  link.exit().remove();
  link.enter().append("path")
      .attr("stroke-linecap","round")
    .merge(link)
      .attr("stroke", d => d.target.color)
      .attr("stroke-opacity", 0.42)
      .attr("stroke-width", d => Math.max(1.1, 2.6 - d.target.depth * 0.45))
      .attr("d", linkPath);

  const node = gNode.selectAll("g.node-g").data(nodes, d => d.id);
  node.exit().remove();

  const ent = node.enter().append("g")
    .attr("class","node-g")
    .attr("tabindex", 0)
    .attr("role","treeitem")
    .on("click", (ev,d) => { ev.stopPropagation(); showPanel(d); })
    .on("keydown", (ev,d) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(d); }
    });

  ent.append("rect").attr("class","node-box").attr("rx",7).attr("ry",7);
  ent.append("rect").attr("class","node-bar").attr("rx",1.5).attr("ry",1.5);
  ent.append("text").attr("class","node-label").attr("dominant-baseline","middle");
  ent.append("g").attr("class","node-tags");
  ent.append("circle").attr("class","node-toggle").attr("r",7)
     .on("click", (ev,d) => {
       ev.stopPropagation();
       if (hasKids(d)) { toggle(d); }
       else { toggleCheckNode(d); render(); updateProgress(); }
     });
  ent.append("text").attr("class","node-count")
     .attr("text-anchor","middle").attr("dominant-baseline","central")
     .style("pointer-events","none");

  const all = ent.merge(node);

  if (layout === "radial") {
    all.attr("transform", d => `translate(${d.px},${d.py})`);
    all.select(".node-box").attr("opacity",0).attr("width",0).attr("height",0);
    all.select(".node-bar").attr("opacity",0).attr("width",0).attr("height",0);
    all.select(".node-tags").selectAll("*").remove();
    all.select(".node-label")
      .attr("font-family",FONT).attr("font-size",d=>d.fs).attr("font-weight",d=>d.fw)
      .attr("fill",C.text)
      .attr("transform", d => {
        const deg = d.angle * 180 / Math.PI;
        const flip = (d.angle > Math.PI/2 || d.angle < -Math.PI/2);
        return `rotate(${deg}) translate(${flip ? -12 : 12},0) ${flip ? "rotate(180)" : ""}`;
      })
      .attr("text-anchor", d => (d.angle > Math.PI/2 || d.angle < -Math.PI/2) ? "end" : "start")
      .text(d => d.label);
    all.select(".node-toggle")
      .attr("cx",0).attr("cy",0)
      .attr("r", d => d.depth === 0 ? 9 : (hasKids(d) ? 6.5 : 5))
      .attr("fill", d => hasKids(d) ? (d._children ? d.color : C.nodeBg) : (checks[d.pathKey] ? "#2E9E5B" : C.nodeBg))
      .attr("stroke", d => hasKids(d) ? d.color : (checks[d.pathKey] ? "#2E9E5B" : C.muted))
      .attr("stroke-width",2)
      .style("display",null);
    all.select(".node-count").text("");
  } else {
    all.attr("transform", d => `translate(${d.px},${d.py - d.h/2})`);
    all.select(".node-box")
      .attr("width", d=>d.w).attr("height", d=>d.h).attr("opacity",1)
      .attr("fill", C.nodeBg)
      .attr("stroke", d => d.depth === 0 ? d.color : C.line)
      .attr("stroke-width", d => d.depth === 0 ? 1.8 : 1);
    all.select(".node-bar")
      .attr("x",0).attr("y",5).attr("width",3.5).attr("height", d=>d.h-10)
      .attr("opacity",1).attr("fill", d=>d.color);
    all.select(".node-label")
      .attr("x", PAD_X).attr("y", d=>d.h/2)
      .attr("transform",null).attr("text-anchor","start")
      .attr("font-family",FONT).attr("font-size",d=>d.fs).attr("font-weight",d=>d.fw)
      .attr("fill",C.text).text(d=>d.label);
    all.select(".node-tags").each(function(d){
      const g = d3.select(this); g.selectAll("*").remove();
      let x = PAD_X + measure(d.label, d.fs, d.fw) + 8;
      (d.data.tags || []).forEach(t => {
        const tw = measure(t,10,500) + 16;
        g.append("rect").attr("x",x).attr("y",d.h/2-8).attr("width",tw).attr("height",16)
         .attr("rx",8).attr("fill","none").attr("stroke",d.color).attr("stroke-opacity",.5);
        g.append("text").attr("x",x+tw/2).attr("y",d.h/2).attr("text-anchor","middle")
         .attr("dominant-baseline","central").attr("font-family",FONT)
         .attr("font-size",10).attr("font-weight",500).attr("fill",C.muted).text(t);
        x += tw + 4;
      });
    });
    all.select(".node-toggle")
      .attr("cx", d=>d.w).attr("cy", d=>d.h/2).attr("r",7.5)
      .attr("fill", d => hasKids(d) ? (d._children ? d.color : C.nodeBg) : (checks[d.pathKey] ? "#2E9E5B" : C.nodeBg))
      .attr("stroke", d => hasKids(d) ? d.color : (checks[d.pathKey] ? "#2E9E5B" : C.muted))
      .attr("stroke-width",1.6)
      .style("display",null);
    all.select(".node-count")
      .attr("x", d=>d.w).attr("y", d=>d.h/2)
      .attr("font-family",FONT).attr("font-size", d => hasKids(d) ? 9 : 10).attr("font-weight",700)
      .attr("fill", d => hasKids(d) ? (d._children ? "#fff" : d.color) : "#fff")
      .text(d => hasKids(d) ? (d._children ? (d._children.length) : "–") : (checks[d.pathKey] ? "✓" : ""));
  }

  all.select("title").remove();
  all.append("title").text(d => d.data.note ? `${d.data.name}\n${d.data.note}` : d.data.name);
  applySearch();
}

const hasKids = d => !!(d.children || d._children);
function toggle(d){
  if (!hasKids(d)) return;
  if (d.children){ d._children = d.children; d.children = null; }
  else { d.children = d._children; d._children = null; }
  render();
}

/* ---------- panel ---------- */
function showPanel(d){
  selected = d;
  const path = d.ancestors().reverse().map(n => n.data.name);
  document.getElementById("p-path").textContent = path.slice(0,-1).join(" › ") || "—";
  document.getElementById("p-name").textContent = d.data.name;
  const tg = document.getElementById("p-tags"); tg.innerHTML = "";
  (d.data.tags || []).forEach(t => {
    const s = document.createElement("span"); s.className = "p-tag"; s.textContent = t; tg.appendChild(s);
  });
  const body = document.getElementById("p-body"); body.innerHTML = "";
  if (d.data.note){
    const p = document.createElement("div"); p.className = "p-note"; p.textContent = d.data.note; body.appendChild(p);
  } else {
    const p = document.createElement("div"); p.className = "p-empty"; p.textContent = "상세 내용 없음"; body.appendChild(p);
  }
  if (d.data.link){
    const a = document.createElement("a");
    a.className = "p-link"; a.href = d.data.link; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = "링크 열기 ↗"; body.appendChild(a);
  }
  const kids = (d.children || d._children || []).length;
  const leaves = d.leaves().length;
  document.getElementById("p-meta").textContent =
    `깊이 ${d.depth} · 하위 ${kids}개` + (kids ? ` · 잎 ${leaves}개` : "");
  document.getElementById("panel").classList.add("open");
}
document.getElementById("p-close").onclick = () => document.getElementById("panel").classList.remove("open");
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.getElementById("cl-overlay").classList.contains("open")) document.getElementById("cl-overlay").classList.remove("open");
  else document.getElementById("panel").classList.remove("open");
});

/* ---------- search ---------- */
let query = "";
function applySearch(){
  const nodes = gNode.selectAll("g.node-g");
  if (!query){ nodes.classed("dim",false).classed("hit",false);
    document.getElementById("hitcount").textContent = ""; return; }
  const q = query.toLowerCase();
  let hits = 0;
  nodes.each(function(d){
    const t = ((d.data.name||"") + " " + (d.data.note||"") + " " + (d.data.tags||[]).join(" ")).toLowerCase();
    const hit = t.includes(q);
    if (hit) hits++;
    d3.select(this).classed("hit",hit).classed("dim",!hit);
  });
  gNode.selectAll("g.node-g.hit").select(".node-box").attr("stroke", d => d.color);
  document.getElementById("hitcount").textContent = hits ? `${hits}건` : "0건";
}
document.getElementById("search").addEventListener("input", e => {
  query = e.target.value.trim();
  if (query){
    // 검색어를 포함한 노드의 조상을 자동으로 펼침
    const q = query.toLowerCase();
    let changed = false;
    root.each(d => {
      const t = ((d.data.name||"")+" "+(d.data.note||"")).toLowerCase();
      if (t.includes(q)) d.ancestors().forEach(a => {
        if (a._children){ a.children = a._children; a._children = null; changed = true; }
      });
    });
    if (changed){ render(); return; }
  }
  applySearch();
});

/* ---------- controls ---------- */
function expandAll(d){ if (d._children){ d.children = d._children; d._children = null; } (d.children||[]).forEach(expandAll); }
document.getElementById("btn-expand").onclick = () => { expandAll(root); render(); fit(); };
document.getElementById("btn-collapse").onclick = () => {
  (root.children || root._children || []).forEach(collapse);
  if (root._children){ root.children = root._children; root._children = null; }
  render(); fit();
};

// 현재 화면에 보이는 노드 중 가장 깊은 depth = "프론티어".
// root.descendants()는 .children 경로만 따라가므로 접힌(._children) 하위는 잡히지 않는다 → 딱 프론티어만 나온다.
function frontierDepth(){ return d3.max(root.descendants(), d => d.depth) || 0; }

document.getElementById("btn-expand-one").onclick = () => {
  const f = frontierDepth();
  let changed = false;
  root.each(d => { if (d.depth === f && d._children) { d.children = d._children; d._children = null; changed = true; } });
  if (changed) { render(); fit(); }
};
document.getElementById("btn-collapse-one").onclick = () => {
  const f = frontierDepth();
  if (f <= 0) return; // 루트만 남았으면 더 접을 게 없음
  let changed = false;
  root.each(d => { if (d.depth === f - 1 && d.children) { d._children = d.children; d.children = null; changed = true; } });
  if (changed) { render(); fit(); }
};

document.getElementById("btn-fit").onclick = () => fit();
document.getElementById("btn-layout").onclick = e => {
  layout = layout === "radial" ? "horizontal" : "radial";
  e.target.textContent = layout === "radial" ? "트리형" : "방사형";
  render(); fit();
};

function fit(){
  const b = gRoot.node().getBBox();
  const s = svg.node().getBoundingClientRect();
  if (!b.width || !b.height) return;
  const k = Math.min(s.width / (b.width + 90), s.height / (b.height + 90), 1.5);
  const tx = s.width/2 - k*(b.x + b.width/2);
  const ty = s.height/2 - k*(b.y + b.height/2);
  svg.transition().duration(350).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(k));
}

/* ---------- export ---------- */
function serialize(){
  const b = gRoot.node().getBBox(), m = 40;
  const clone = svg.node().cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  clone.setAttribute("width", Math.ceil(b.width + m*2));
  clone.setAttribute("height", Math.ceil(b.height + m*2));
  clone.setAttribute("viewBox", `${b.x-m} ${b.y-m} ${b.width+m*2} ${b.height+m*2}`);
  clone.querySelector("g").setAttribute("transform","");
  if (!RAW_DATA.transparent){
    const bg = document.createElementNS("http://www.w3.org/2000/svg","rect");
    bg.setAttribute("x",b.x-m); bg.setAttribute("y",b.y-m);
    bg.setAttribute("width",b.width+m*2); bg.setAttribute("height",b.height+m*2);
    bg.setAttribute("fill", cssv("--mm-bg") || "#fff");
    clone.insertBefore(bg, clone.firstChild);
  }
  clone.querySelectorAll(".dim").forEach(n => n.setAttribute("opacity","0.18"));
  return {xml:new XMLSerializer().serializeToString(clone), w:b.width+m*2, h:b.height+m*2};
}
function download(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const fname = (RAW_DATA.title || "mindmap").replace(/[^\w가-힣.-]+/g,"_");
document.getElementById("btn-svg").onclick = () => {
  download(new Blob([serialize().xml], {type:"image/svg+xml;charset=utf-8"}), fname + ".svg");
};
document.getElementById("btn-png").onclick = () => {
  const {xml,w,h} = serialize(), scale = 2;
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement("canvas");
    cv.width = Math.ceil(w*scale); cv.height = Math.ceil(h*scale);
    const cx = cv.getContext("2d"); cx.scale(scale,scale); cx.drawImage(img,0,0);
    cv.toBlob(bl => download(bl, fname + ".png"), "image/png");
  };
  img.onerror = () => alert("PNG 변환 실패 — SVG로 내려받은 뒤 변환하세요.");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
};

/* ---------- boot ---------- */
render();
window.addEventListener("resize", () => { /* keep transform; user can hit 화면 맞춤 */ });
setTimeout(fit, 60);
if (document.fonts) document.fonts.ready.then(() => { remeasure(); render(); fit(); });
</script>
</body>
